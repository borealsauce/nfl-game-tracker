<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>NFL Game Tracker</title>
<style>
:root{--bg:#0b0f17;--card:#141b27;--line:#253044;--tx:#e6edf6;--mut:#8a97ab;--acc:#3ea6ff;--grn:#3ccf7a;--yel:#ffcf3e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:5}
h1{font-size:17px;margin:0;flex:1}button,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:14px;cursor:pointer}
main{max-width:1200px;margin:auto;padding:14px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin:18px 4px 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.gc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer}.gc:hover{border-color:var(--acc)}
.tr{display:flex;align-items:center;gap:8px;margin:4px 0}.tr img{width:34px;height:34px}.tr .n{flex:1;font-weight:600;font-size:17px}.tr .s{font-size:34px;font-weight:800}
.st{font-size:12px;color:var(--mut);margin-top:6px}.live{color:#ff5a5a;font-weight:700}
.sb{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:8px}
.tm{display:flex;align-items:center;gap:10px}.tm img{width:56px;height:56px}.tm .s{font-size:64px;font-weight:900;line-height:1}.mid{text-align:center;color:var(--mut);font-size:17px}
.ball{color:var(--yel);font-size:22px}.sit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:20px;font-weight:700;text-align:center}
.sit small{display:block;font-size:14px;color:var(--mut);font-weight:400;margin-top:4px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:760px){.cols{grid-template-columns:1fr}.tm .s{font-size:48px}.tm img{width:40px;height:40px}.mid{font-size:14px}}
.pan{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto}
.lp{background:#1d2738;border:1px solid var(--yel);border-radius:12px;padding:12px;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:18px;font-weight:700}
.num{display:inline-block;min-width:2.3em;font-size:1.25em;font-weight:900;color:var(--yel)}
h3{font-size:14px;color:var(--mut);margin:14px 0 4px;text-transform:uppercase;letter-spacing:.06em}
table{border-collapse:collapse;table-layout:fixed;width:100%}th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;position:relative}
td{font-size:20px;font-weight:700}th:first-child,td:first-child{text-align:left;width:46%}td:first-child{font-size:18px}
th{color:var(--mut);font-size:13px;font-weight:600}tr.hot td{background:rgba(255,207,62,.13)}
.rz{position:absolute;right:0;top:0;bottom:0;width:7px;cursor:col-resize;user-select:none}.rz:hover{background:var(--acc)}
.pos{color:var(--mut);font-size:13px;font-weight:600;margin-left:4px}
.note{color:var(--mut);font-size:12px;margin:10px 4px}
</style></head><body>
<header><button id="back" hidden onclick="go(null)">‹ Games</button><h1>🏈 NFL Game Tracker</h1><span id="upd" style="color:var(--mut);font-size:12px;white-space:nowrap"></span><select id="team" title="Jump to team's game"></select></header>
<main id="app"><div class="note">Loading…</div></main>
<script>
const B='https://site.api.espn.com/apis/site/v2/sports/football/nfl/',SB=B+'scoreboard',SU=B+'summary?event=';
const app=document.getElementById('app');let timer,events=[];const W={},RP={};const RANK={QB:0,RB:1,FB:2,WR:3,TE:4};
async function roster(gid,tids){if(RP[gid])return RP[gid];const m={};await Promise.all(tids.map(t=>j(B+'teams/'+t+'/roster').then(r=>(r.athletes||[]).forEach(g=>(g.items||[]).forEach(a=>{m[a.id]=[a.position&&a.position.abbreviation,a.jersey]}))).catch(()=>{})));if(Object.keys(m).length)RP[gid]=m;return m}
const pt=d=>new Date(d).toLocaleString('en-US',{timeZone:'America/Los_Angeles',weekday:'short',hour:'numeric',minute:'2-digit'})+' PT';
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const params=()=>new URLSearchParams(location.search);
function go(id){const u=new URL(location);u.search=id?'?game='+id:'';history.pushState(null,'',u);route()}
addEventListener('popstate',route);addEventListener('DOMContentLoaded',route);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)route()});
function upd(){document.getElementById('upd').textContent='Updated '+new Date().toLocaleTimeString('en-US',{timeZone:'America/Los_Angeles',hour:'numeric',minute:'2-digit',second:'2-digit'})+' PT'}
async function j(u){const r=await fetch(u+(u.includes('?')?'&':'?')+'_='+Date.now());if(!r.ok)throw Error(r.status);return r.json()}
async function loadSB(){const d=await j(SB);events=d.events||[];
 const sel=document.getElementById('team'),teams=[];events.forEach(e=>e.competitions[0].competitors.forEach(c=>teams.push([c.team.displayName,e.id])));
 teams.sort((a,b)=>a[0].localeCompare(b[0]));sel.innerHTML='<option value="">Team…</option>'+teams.map(t=>'<option value="'+t[1]+'">'+esc(t[0])+'</option>').join('');
 sel.onchange=()=>sel.value&&go(sel.value)}
async function route(){clearTimeout(timer);const id=params().get('game');
 if(!events.length)try{await loadSB()}catch(e){app.innerHTML='<div class="note">Could not load scoreboard: '+e+'</div>';timer=setTimeout(route,15000);return}
 document.getElementById('back').hidden=!id;id?gameView(id):listView()}
function sitTxt(s,c){if(!s||s.down==null||s.down<1)return '';const o=['','1st','2nd','3rd','4th'][s.down]||s.down+'th';return o+' & '+(s.isRedZone&&s.distance>=100-s.yardLine?'Goal':s.distance)+(s.possessionText?' at '+s.possessionText:'')}
function card(e){const c=e.competitions[0],st=e.status.type,s=c.situation||{},a=c.competitors.find(x=>x.homeAway=='away'),h=c.competitors.find(x=>x.homeAway=='home');
 const row=t=>'<div class="tr"><img src="'+t.team.logo+'" alt=""><span class="n">'+esc(t.team.displayName)+(st.state=='in'&&s.possession==t.team.id?' <span class="ball">🏈</span>':'')+'</span><span class="s">'+(st.state=='pre'?'':t.score)+'</span></div>';
 const x=st.state=='in'?'<span class="live">● LIVE</span> '+esc(st.detail)+(sitTxt(s)?' · '+esc(sitTxt(s)):''):st.state=='pre'?'Kickoff '+pt(e.date):esc(st.detail);
 return '<div class="gc" onclick="go(\''+e.id+'\')">'+row(a)+row(h)+'<div class="st">'+x+'</div></div>'}
async function listView(){try{await loadSB()}catch(e){}
 const f=s=>events.filter(e=>e.status.type.state==s),L=f('in'),U=f('pre'),F=f('post');
 let h='<h2>Live now ('+L.length+')</h2>'+(L.length?'<div class="grid">'+L.map(card).join('')+'</div>':'<div class="note">No games live right now.</div>');
 if(U.length)h+='<h2>Upcoming</h2><div class="grid">'+U.map(card).join('')+'</div>';if(F.length)h+='<h2>Final</h2><div class="grid">'+F.map(card).join('')+'</div>';
 app.innerHTML=h+'<div class="note">Refreshes every 15s · data: ESPN</div>';upd();timer=setTimeout(listView,15000)}
const CATS=[['passing','Passing',['C/ATT','YDS','TD','INT','SACKS']],['rushing','Rushing',['CAR','YDS','AVG','TD','LONG']],['receiving','Receiving',['REC','YDS','TD','LONG','TGTS']],['defensive','Defense',['TOT','SOLO','SACKS','TFL','PD']],['interceptions','Interceptions',['INT','YDS','TD']],['kicking','Kicking',['FG','XP','PTS']],['punting','Punting',['NO','YDS','AVG']],['kickReturns','Kick returns',['NO','YDS','LONG']],['puntReturns','Punt returns',['NO','YDS','LONG']]];
const who=(n,name,pos)=>'<span class="num">#'+esc(n||'?')+'</span>'+esc(name)+(pos?'<span class="pos">'+esc(pos)+'</span>':'');
async function gameView(id){let d,sbE;try{[d]=await Promise.all([j(SU+id),loadSB().catch(()=>{})]);sbE=events.find(e=>e.id==id)}catch(e){app.innerHTML='<div class="note">Could not load game: '+e+'</div>';timer=setTimeout(()=>gameView(id),15000);return}
 if(params().get('game')!==id)return;clearTimeout(timer);
 const comp=d.header.competitions[0],st=comp.status.type,state=st.state,cs=comp.competitors,a=cs.find(x=>x.homeAway=='away'),h=cs.find(x=>x.homeAway=='home');
 const s=(sbE&&sbE.competitions[0].situation)||{};const R=await roster(id,cs.map(c=>c.team.id));
 // positions + jerseys from play participants; last plays
 const dr=d.drives||{},plays=[].concat(...(dr.previous||[]).map(x=>x.plays||[]),(dr.current&&dr.current.plays)||[]);
 const pos={},jer={};plays.forEach(p=>(p.participants||[]).forEach(x=>{const t=x.athlete;if(t.position)pos[t.id]=t.position.abbreviation;if(R[t.id]&&R[t.id][0])pos[t.id]=R[t.id][0];if(t.jersey)jer[t.id]=t.jersey}));
 for(const k in R)if(R[k][0])pos[k]=R[k][0];
 const recent=plays.filter(p=>(p.participants||[]).length).slice(-3).reverse(),hot=new Set();recent.slice(0,1).forEach(p=>p.participants.forEach(x=>hot.add(x.athlete.id)));
 const tmHTML=t=>'<div class="tm"><img src="'+(t.team.logos?t.team.logos[0].href:t.team.logo)+'" alt=""><div><div style="font-weight:700">'+esc(t.team.abbreviation)+(s.possession==t.team.id&&state=='in'?' <span class="ball">🏈</span>':'')+'</div><div class="s">'+(state=='pre'?'–':esc(t.score))+'</div></div></div>';
 const mid=state=='in'?'<span class="live">● LIVE</span><br><b style="font-size:26px;color:var(--tx)">'+esc(st.shortDetail||st.detail)+'</b>':state=='pre'?'Kickoff<br>'+pt(comp.date):'<b style="font-size:24px;color:var(--tx)">'+esc(st.detail)+'</b>';
 let html='<div class="sb">'+tmHTML(a)+'<div class="mid">'+mid+'</div>'+tmHTML(h)+'</div>';
 if(state=='in'){const posT=cs.find(c=>c.team.id==s.possession);html+='<div class="sit">'+(posT?'🏈 '+esc(posT.team.abbreviation)+' ball · ':'')+(esc(sitTxt(s))||esc(s.downDistanceText||'—'))+(s.isRedZone?' · <span style="color:#ff5a5a">Red zone</span>':'')+'<small>'+esc((s.lastPlay&&s.lastPlay.text)||'')+'</small></div>'}
 if(recent.length){html+='<div class="lp"><b>Last play'+(recent.length>1?'s':'')+' — who was involved</b>';recent.forEach((p,i)=>{html+='<div class="note" style="margin:8px 0 0;'+(i?'':'color:var(--tx);font-size:14px')+'">Q'+esc(p.period&&p.period.number)+' '+esc(p.clock&&p.clock.displayValue)+' · '+esc(p.text)+'</div><div class="chips">'+p.participants.filter((x,i,A)=>A.findIndex(y=>y.athlete.id==x.athlete.id)==i).map(x=>'<span class="chip">'+who(x.athlete.jersey,x.athlete.shortName||x.athlete.displayName,(R[x.athlete.id]&&R[x.athlete.id][0])||(x.athlete.position&&x.athlete.position.abbreviation))+'</span>').join('')+'</div>'});html+='</div>'}
 const ballT=state=='in'&&cs.find(c=>c.team.id==s.possession),show=ballT?[ballT]:[a,h];
 html+='<div class="cols"'+(ballT?' style="grid-template-columns:1fr"':'')+'>';
 for(const t of show){const b=(d.boxscore.players||[]).find(x=>x.team.id==t.team.id);html+='<div class="pan"><div style="font-weight:800;font-size:18px">'+(ballT?'🏈 On offense: ':'')+esc(t.team.displayName)+'</div>';
  if(!b){html+='<div class="note">'+(state=='pre'?'Player stats appear after kickoff.':'No player stats yet.')+'</div></div>';continue}
  const seen=new Set();
  for(const [k,lbl,want] of CATS){const c=b.statistics.find(x=>x.name==k);if(!c||!c.athletes.length)continue;const idx=want.map(w=>c.labels.indexOf(w)).filter(i=>i>=0);
   html+='<h3>'+lbl+'</h3><table data-k="'+t.team.id+k+'"><thead><tr><th>Player</th>'+idx.map(i=>'<th>'+esc(c.labels[i])+'</th>').join('')+'</tr></thead><tbody>'+
   (['passing','rushing','receiving'].includes(k)?c.athletes.map((x,i)=>[x,i]).sort((p,q)=>((RANK[pos[p[0].athlete.id]]??9)-(RANK[pos[q[0].athlete.id]]??9))||p[1]-q[1]).map(p=>p[0]):c.athletes).map(x=>{const A=x.athlete;seen.add(A.id);const jn=A.jersey||(R[A.id]&&R[A.id][1])||jer[A.id];return '<tr class="'+(hot.has(A.id)?'hot':'')+'"><td data-v="'+esc(A.displayName)+'" title="'+esc(A.displayName)+'">'+who(jn,A.displayName,pos[A.id])+'</td>'+idx.map(i=>'<td>'+esc(x.stats[i])+'</td>').join('')+'</tr>'}).join('')+'</tbody></table>'}
  html+='<div class="note">'+seen.size+' players with stats</div></div>'}
 html+='</div><div class="note">'+(ballT?'In-game view shows only the team with the ball; it switches automatically on possession change. ':'')+'Who\'s in: ESPN\'s free data does not publish the 11 players on the field. This shows every player who has recorded a stat in this game, plus the players named in the last plays (highlighted in yellow). '+(state=='post'?'Final.':'Refreshes every 15s.')+' Data: ESPN.</div>';
 const keep=[...app.querySelectorAll('table')].map(t=>{const th=t.querySelector('th[data-sdir]');return th?[t.dataset.k,th.cellIndex,th.dataset.sdir]:null}).filter(Boolean);
 app.innerHTML=html;keep.forEach(([k,ci,dir])=>{const t=app.querySelector('table[data-k="'+k+'"]');if(!t)return;const th=t.rows[0].cells[ci];th.click();if(dir==='desc')th.click()});
 addRz();upd();if(state!='post')timer=setTimeout(()=>gameView(id),15000)}
function addRz(){app.querySelectorAll('table').forEach(t=>{[...t.rows[0].cells].forEach((th,i)=>{const key=t.dataset.k+':'+i;if(W[key])th.style.width=W[key]+'px';const r=document.createElement('span');r.className='rz';th.appendChild(r);
 r.addEventListener('click',e=>e.stopPropagation());r.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();const x0=e.clientX,w0=th.offsetWidth;r.setPointerCapture(e.pointerId);
 const mv=ev=>{const w=Math.max(40,w0+ev.clientX-x0);th.style.width=w+'px';W[key]=w};r.addEventListener('pointermove',mv);r.addEventListener('pointerup',()=>r.removeEventListener('pointermove',mv),{once:true})})})})}
</script><!--SORTABLE-START--><script>
/* Shared sortable tables (Grok Bot trackers). Click any header: asc/desc toggle with ▲/▼.
   Works on dynamically rendered tables via event delegation. Totals (tfoot, .total/.ft/.tot rows,
   or first cell TOTAL/ALL-TIME/GRAND) stay pinned at bottom. Group-label rows (fewer cells / colspan)
   keep their members: sorting happens within each group. Uses td[data-v] when present.
   Skip: th with own onclick, th.nosort, or table[data-nosort]. */
(function(){
  if(window.__sortableShared)return;window.__sortableShared=1;
  var st=document.createElement('style');
  st.textContent='table:not([data-nosort]) th:not(.nosort){cursor:pointer;user-select:none}th .srt-ar{font-size:.8em;opacity:.85;margin-left:3px}';
  (document.head||document.documentElement).appendChild(st);
  var MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  function key(cell){
    if(!cell)return null;
    var raw=cell.dataset&&cell.dataset.v!=null?cell.dataset.v:cell.textContent;
    var s=String(raw).replace(/[▲▼]/g,'').trim();
    if(!s||s==='—'||s==='-'||s==='–'||/^n\/?a$/i.test(s))return null;
    var m;
    if((m=s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/)))return {n:Date.UTC(+m[1],+m[2]-1,+(m[3]||1))};
    if((m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/))){var y=+m[3];if(y<100)y+=2000;return {n:Date.UTC(y,+m[1]-1,+m[2])};}
    if((m=s.match(/^([A-Za-z]{3})[a-z]*\.? (\d{1,2}),? (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[3],MON[m[1].toLowerCase()]-1,+m[2])};
    if((m=s.match(/^([A-Za-z]{3})[a-z]* (\d{4})$/))&&MON[m[1].toLowerCase()])return {n:Date.UTC(+m[2],MON[m[1].toLowerCase()]-1,1)};
    if((m=s.match(/^Q([1-4]) (\d{4})$/i)))return {n:Date.UTC(+m[2],(+m[1]-1)*3,1)};
    var t=s.replace(/[$,%x×\s]|USD/gi,'').replace(/^\+/,'').replace(/[−–]/g,'-');
    var neg=/^\(.*\)$/.test(t);if(neg)t=t.slice(1,-1);
    var mult=1;if((m=t.match(/^(-?[\d.]+)([KMB])$/i))){t=m[1];mult={k:1e3,m:1e6,b:1e9}[m[2].toLowerCase()];}
    if(/^-?\d*\.?\d+$/.test(t))return {n:parseFloat(t)*mult*(neg?-1:1)};
    return {s:s.toLowerCase()};
  }
  function pinned(r){
    if(r.parentElement&&r.parentElement.tagName==='TFOOT')return true;
    if(/(^|\s)(total|totals|ft|tot|sum|grand|pinned)(\s|$)/i.test(r.className))return true;
    var c=r.cells[0];return !!c&&/^\s*(TOTAL|TOTALS|ALL-TIME|GRAND TOTAL)\b/i.test(c.textContent);
  }
  document.addEventListener('click',function(e){
    var th=e.target.closest&&e.target.closest('th');if(!th||th.onclick||th.classList.contains('nosort'))return;
    var tb=th.closest('table');if(!tb||tb.hasAttribute('data-nosort'))return;
    var hr=th.parentElement;if(hr.parentElement.tagName==='TFOOT')return;
    var ci=0;for(var k=0;k<hr.cells.length&&hr.cells[k]!==th;k++)ci+=hr.cells[k].colSpan||1;
    var ncol=0;for(k=0;k<hr.cells.length;k++)ncol+=hr.cells[k].colSpan||1;
    var dir=th.dataset.sdir==='asc'?'desc':'asc',m=dir==='asc'?1:-1;
    tb.querySelectorAll('th').forEach(function(x){delete x.dataset.sdir;var a=x.querySelector('.srt-ar');if(a)a.remove();});
    th.dataset.sdir=dir;var ar=document.createElement('span');ar.className='srt-ar';ar.textContent=dir==='asc'?'▲':'▼';th.appendChild(ar);
    var bodies=tb.tBodies.length?[].slice.call(tb.tBodies):[tb];
    bodies.forEach(function(body){
      var all=[].slice.call(body.rows).filter(function(r){return r!==hr&&!(r.cells.length&&r.cells[0].tagName==='TH'&&!r.querySelector('td'));});
      var pins=[],groups=[{head:null,rows:[]}];
      all.forEach(function(r){
        if(pinned(r)){pins.push(r);return;}
        var w=0;for(var j=0;j<r.cells.length;j++)w+=r.cells[j].colSpan||1;
        if(r.cells.length===1&&ncol>1)groups.push({head:r,rows:[]});else groups[groups.length-1].rows.push(r);
      });
      function cellAt(r){var x=0;for(var j=0;j<r.cells.length;j++){if(x===ci)return r.cells[j];x+=r.cells[j].colSpan||1;}return null;}
      groups.forEach(function(g){
        g.rows.sort(function(a,b){var A=key(cellAt(a)),B=key(cellAt(b));
          if(!A&&!B)return 0;if(!A)return 1;if(!B)return -1;
          if(A.n!=null&&B.n!=null)return (A.n-B.n)*m;
          return String(A.s!=null?A.s:A.n).localeCompare(String(B.s!=null?B.s:B.n),undefined,{numeric:true})*m;});
        if(g.head)body.appendChild(g.head);g.rows.forEach(function(r){body.appendChild(r);});
      });
      pins.forEach(function(r){body.appendChild(r);});
    });
  },false);
})();

</script><!--SORTABLE-END-->
</body></html>
